<body data-pagina="galeria">
<div class="nf-telon" aria-hidden="true"><span>Galería</span></div>
<div id="nf-cabecera"></div>
<main id="contenido">
<section class="hero hero--foto" aria-labelledby="titulo">
  <div class="hero__foto"><img data-cms-img="galeria.foto_portada" data-etiqueta="Portada: foto" src="/assets/img/fotos/piscina-casa.jpg" alt="Piscina y casa principal" fetchpriority="high"></div>
  <div class="contenedor hero__contenido">
    <div class="hero__principal">
      <nav class="ruta nf-in" aria-label="Ruta"><a class="nf-lnk" href="/index.html">Inicio</a><span aria-hidden="true">/</span><span aria-current="page">Galería</span></nav>
      <p class="etiqueta nf-in d1" data-cms="galeria.etiqueta" data-etiqueta="Texto pequeño sobre el título">Galería</p>
      <h1 id="titulo"><span class="nf-mask"><span class="linea d1" data-cms="galeria.titulo_1" data-etiqueta="Título, línea 1">Un día cualquiera</span></span><span class="nf-mask"><span class="linea d2" data-cms="galeria.titulo_2" data-etiqueta="Título, línea 2 (en cursiva)"><em>en la finca</em></span></span></h1>
    </div>
    <div class="hero__lado nf-in d3">
      <p class="lead" data-cms="galeria.intro" data-etiqueta="Texto de presentación">Fotos de la casa, las habitaciones, la piscina y las celebraciones que han pasado por aquí.</p>
      
    </div>
  </div>
</section>
<div class="barra-filtros"><div class="contenedor"><div class="chips" role="group" aria-label="Filtrar fotos" id="galeria-filtros"></div></div></div>
<section class="seccion seccion--noche" style="padding-top:48px" aria-label="Fotos"><div class="contenedor"><div class="masonry" id="galeria-lista"></div></div></section>
<div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Foto ampliada" hidden>
  <div class="visor__barra"><span id="visor-titulo"></span><span style="display:flex;gap:14px;align-items:center"><span class="cifra" style="font-size:22px" id="visor-cuenta"></span><button type="button" class="boton-icono" id="visor-cerrar" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span></div>
  <div class="visor__centro"><button type="button" class="boton-icono" id="visor-ant" aria-label="Foto anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><div><img id="visor-img" alt=""></div><button type="button" class="boton-icono" id="visor-sig" aria-label="Foto siguiente"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
</div>
<section class="seccion seccion--oscura" aria-label="Siguiente paso" style="text-align:center">
  <div class="contenedor pila" style="align-items:center;max-width:860px">
    <h2 class="titulo nf-rv" data-cms="galeria.cierre_titulo" data-etiqueta="Cierre: título">¿Te imaginas aquí?</h2>
    <p class="lead nf-rv r2" data-cms="galeria.cierre_texto" data-etiqueta="Cierre: texto">Las fotos se quedan cortas. Ven a conocerla.</p>
    <div class="botones nf-rv r3" style="justify-content:center"><a href="/reservar.html" class="btn btn--oro btn--grande nf-btn v-oscuro nf-brillo">Reservar ahora</a><a data-wa href="/contacto.html" class="btn btn--claro btn--grande nf-btn v-crema">Escribir por WhatsApp</a></div>
  </div>
</section>
</main>
<div id="nf-pie"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
